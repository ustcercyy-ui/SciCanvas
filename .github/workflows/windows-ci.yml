name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\SciCanvas.sln

      - name: Build Release with warnings as errors
        run: dotnet build .\SciCanvas.sln --configuration Release --no-restore -warnaserror

      - name: Test Release
        run: dotnet test .\SciCanvas.sln --configuration Release --no-build --no-restore
